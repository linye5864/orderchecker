[alembic]
# 脚本位置
script_location = alembic

# 日志格式
format = %(asctime)s,%(levelname)s,%(message)s

# 时间格式
time_format = %H:%M:%S

# 版本路径格式
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# 是否启用缓存
disable_versioning = false

# SQLAlchemy URL (使用 SQLite 进行本地开发)
sqlalchemy.url = sqlite:///data/ordercomparer.db

# 迁移日志位置
revision_environment = false

# 任务历史表
task_history_environment = false

# 目标元数据
target_metadata = None

# 版本位置
version_path_separator = os

# 支持的版本降级
downgrade_replacement = False

[post_write_hooks]
hooks = black

[black]
line_length = 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(asctime)s,%(levelname)s,%(message)s
datefmt = %H:%M:%S
